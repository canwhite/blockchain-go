syntax = "proto3"; //指定使用 Protocol Buffers 的第 3 版语法。

package helloworld; //定义 proto 文件的包名为 helloworld，便于代码生成时的命名空间管理。

option go_package = "./helloworld"; //指定生成的 Go 代码包路径为 ./helloworld，方便 Go 项目结构管理。

service Greeter { //
  rpc SayHello (HelloRequest) returns (HelloReply);
}

message HelloRequest { //
  string name = 1;
}

message HelloReply { //
  string message = 1;
}

